version: '3.9'

services:
  # ============================================================
  # Frontend - Next.js Mission Control UI
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    depends_on:
      - backend
    networks:
      - nexus-network

  # ============================================================
  # Backend - FastAPI + LangGraph Agents
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - neo4j
      - qdrant
      - postgres
    networks:
      - nexus-network
    volumes:
      - ./data:/app/data:ro

  # ============================================================
  # Neo4j - Knowledge Graph
  # ============================================================
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/nexus-ai-2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - nexus-network

  # ============================================================
  # Qdrant - Vector Database
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexus-network

  # ============================================================
  # PostgreSQL - LangGraph State Store
  # ============================================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nexus_ai
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus-ai-2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-network

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  postgres_data:

networks:
  nexus-network:
    driver: bridge
